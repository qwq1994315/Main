<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言翻译 Demo</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dbe4f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --success: #059669;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #eef4ff 0%, #f8fafc 45%, #f1f5f9 100%);
      color: var(--text);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 32px 16px;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .lang-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .lang-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lang-box label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .lang-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .lang-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .lang-select:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .swap-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s ease;
    }

    .swap-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: rotate(180deg);
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .output-wrap {
      position: relative;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.88);
      backdrop-filter: blur(2px);
      color: var(--primary);
      font-size: 14px;
      font-weight: 500;
      z-index: 2;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(37, 99, 235, 0.18);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    #output {
      background: #f8fafc;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button.primary,
    button.secondary {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.primary:disabled,
    button.secondary:disabled,
    .swap-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.primary.loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    button.primary.loading .btn-spinner {
      display: inline-block;
    }

    button.secondary {
      background: #eef2ff;
      color: #1e3a8a;
    }

    button.secondary:hover {
      background: #e0e7ff;
    }

    .examples {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    .status.ok {
      color: var(--success);
    }

    .status.error {
      color: #dc2626;
    }

    .status.loading {
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .panels {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>多语言翻译 Demo</h1>
      <p>支持中文、英语、俄语、法语、日语互译</p>
    </header>

    <section class="card">
      <div class="lang-bar">
        <div class="lang-box">
          <label for="fromLangSelect">源语言 / From</label>
          <select class="lang-select" id="fromLangSelect"></select>
        </div>
        <button class="swap-btn" id="swapBtn" title="切换语言">⇄</button>
        <div class="lang-box">
          <label for="toLangSelect">目标语言 / To</label>
          <select class="lang-select" id="toLangSelect"></select>
        </div>
      </div>

      <div class="panels">
        <div class="panel">
          <label for="input">输入文本 / Input</label>
          <textarea id="input" placeholder="请输入要翻译的内容..."></textarea>
        </div>
        <div class="panel output-wrap">
          <label for="output">翻译结果 / Output</label>
          <textarea id="output" readonly placeholder="翻译结果会显示在这里..."></textarea>
          <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <span id="loadingText">正在翻译，请稍候...</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="translateBtn">
          <span class="btn-spinner"></span>
          <span id="translateBtnText">翻译 Translate</span>
        </button>
        <button class="secondary" id="clearBtn">清空 Clear</button>
        <button class="secondary" id="copyBtn">复制结果 Copy</button>
      </div>

      <div class="examples" id="examples"></div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const inputEl = document.getElementById("input");
    const outputEl = document.getElementById("output");
    const statusEl = document.getElementById("status");
    const fromLangSelect = document.getElementById("fromLangSelect");
    const toLangSelect = document.getElementById("toLangSelect");
    const examplesEl = document.getElementById("examples");
    const translateBtn = document.getElementById("translateBtn");
    const translateBtnText = document.getElementById("translateBtnText");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const swapBtn = document.getElementById("swapBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");

    let isTranslating = false;

    const LANGUAGES = {
      zh: { code: "zh-CN", label: "中文", placeholder: "请输入要翻译的内容..." },
      en: { code: "en", label: "English", placeholder: "Type text to translate..." },
      ru: { code: "ru", label: "Русский", placeholder: "Введите текст для перевода..." },
      fr: { code: "fr", label: "Français", placeholder: "Saisissez le texte à traduire..." },
      ja: { code: "ja", label: "日本語", placeholder: "翻訳するテキストを入力してください..." }
    };

    const examples = {
      zh: ["你好，世界", "今天天气很好", "人工智能正在改变世界"],
      en: ["Hello, world", "How are you today?", "AI is changing the world"],
      ru: ["Привет, мир", "Как дела?", "Искусственный интеллект меняет мир"],
      fr: ["Bonjour le monde", "Comment ça va ?", "L'intelligence artificielle change le monde"],
      ja: ["こんにちは、世界", "お元気ですか", "人工知能が世界を変えています"]
    };

    function getLangKey(selectEl) {
      return selectEl.value;
    }

    function getLangConfig(key) {
      return LANGUAGES[key];
    }

    function renderLanguageOptions() {
      const options = Object.entries(LANGUAGES)
        .map(([key, lang]) => `<option value="${key}">${lang.label}</option>`)
        .join("");

      fromLangSelect.innerHTML = options;
      toLangSelect.innerHTML = options;
      fromLangSelect.value = "zh";
      toLangSelect.value = "en";
    }

    function updateLangUI() {
      const fromLang = getLangConfig(getLangKey(fromLangSelect));
      inputEl.placeholder = fromLang.placeholder;
      outputEl.placeholder = "翻译结果会显示在这里... / Translation will appear here...";
      renderExamples();
    }

    function renderExamples() {
      const fromKey = getLangKey(fromLangSelect);
      examplesEl.innerHTML = (examples[fromKey] || [])
        .map((text) => `<button class="chip" data-text="${text}">${text}</button>`)
        .join("");
    }

    function ensureDifferentLanguages() {
      if (fromLangSelect.value === toLangSelect.value) {
        const keys = Object.keys(LANGUAGES);
        const currentIndex = keys.indexOf(fromLangSelect.value);
        toLangSelect.value = keys[(currentIndex + 1) % keys.length];
      }
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function setLoading(loading) {
      isTranslating = loading;
      translateBtn.disabled = loading;
      swapBtn.disabled = loading;
      clearBtn.disabled = loading;
      copyBtn.disabled = loading;
      inputEl.disabled = loading;
      fromLangSelect.disabled = loading;
      toLangSelect.disabled = loading;
      translateBtn.classList.toggle("loading", loading);
      loadingOverlay.classList.toggle("active", loading);

      examplesEl.querySelectorAll(".chip").forEach((chip) => {
        chip.disabled = loading;
      });

      if (loading) {
        translateBtnText.textContent = "翻译中...";
        loadingText.textContent = "正在翻译，请稍候...";
        setStatus("正在请求翻译服务...", "loading");
      } else {
        translateBtnText.textContent = "翻译 Translate";
        loadingText.textContent = "正在翻译，请稍候...";
      }
    }

    async function translateText(text) {
      const fromLang = getLangConfig(getLangKey(fromLangSelect));
      const toLang = getLangConfig(getLangKey(toLangSelect));
      const langpair = `${fromLang.code}|${toLang.code}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("翻译服务暂时不可用，请稍后再试。");
      }
      const data = await response.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) {
        throw new Error("未获取到翻译结果。");
      }
      return translated;
    }

    async function handleTranslate() {
      if (isTranslating) return;

      const text = inputEl.value.trim();
      if (!text) {
        setStatus("请先输入要翻译的内容。", "error");
        return;
      }

      if (fromLangSelect.value === toLangSelect.value) {
        setStatus("源语言和目标语言不能相同。", "error");
        return;
      }

      setLoading(true);
      outputEl.value = "";

      try {
        const result = await translateText(text);
        outputEl.value = result;
        setStatus("翻译完成。", "ok");
      } catch (error) {
        setStatus(error.message || "翻译失败，请检查网络后重试。", "error");
      } finally {
        setLoading(false);
      }
    }

    translateBtn.addEventListener("click", handleTranslate);
    clearBtn.addEventListener("click", () => {
      if (isTranslating) return;
      inputEl.value = "";
      outputEl.value = "";
      setStatus("");
    });
    copyBtn.addEventListener("click", async () => {
      if (isTranslating) return;
      if (!outputEl.value) {
        setStatus("没有可复制的内容。", "error");
        return;
      }
      await navigator.clipboard.writeText(outputEl.value);
      setStatus("已复制到剪贴板。", "ok");
    });
    swapBtn.addEventListener("click", () => {
      if (isTranslating) return;
      const tempLang = fromLangSelect.value;
      fromLangSelect.value = toLangSelect.value;
      toLangSelect.value = tempLang;
      const tempText = inputEl.value;
      inputEl.value = outputEl.value;
      outputEl.value = tempText;
      updateLangUI();
      setStatus("已切换翻译方向。");
    });
    fromLangSelect.addEventListener("change", () => {
      ensureDifferentLanguages();
      updateLangUI();
    });
    toLangSelect.addEventListener("change", () => {
      if (fromLangSelect.value === toLangSelect.value) {
        setStatus("源语言和目标语言不能相同。", "error");
      } else {
        setStatus("");
      }
    });
    examplesEl.addEventListener("click", (event) => {
      if (isTranslating) return;
      const chip = event.target.closest(".chip");
      if (!chip) return;
      inputEl.value = chip.dataset.text;
      handleTranslate();
    });
    inputEl.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        handleTranslate();
      }
    });

    renderLanguageOptions();
    updateLangUI();
  </script>
</body>
</html>

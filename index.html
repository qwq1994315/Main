<!DOCTYPE html>
<html lang="zh-CN" data-theme="simple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言翻译 Demo</title>
  <style>
    :root,
    [data-theme="simple"] {
      --body-bg: linear-gradient(160deg, #eef4ff 0%, #f8fafc 45%, #f1f5f9 100%);
      --card: #ffffff;
      --input-bg: #f8fafc;
      --output-bg: #f8fafc;
      --border: #dbe4f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary-bg: #eef2ff;
      --secondary-text: #1e3a8a;
      --secondary-hover: #e0e7ff;
      --text: #0f172a;
      --muted: #64748b;
      --success: #059669;
      --error: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --focus-ring: rgba(37, 99, 235, 0.12);
      --spinner-track: rgba(37, 99, 235, 0.18);
      --overlay-bg: rgba(248, 250, 252, 0.88);
      --chip-bg: #ffffff;
      --swap-btn-bg: #ffffff;
      --radius-card: 16px;
      --radius-input: 12px;
      --radius-btn: 10px;
      --font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    [data-theme="tech"] {
      --body-bg:
        radial-gradient(circle at 10% 10%, rgba(69, 202, 255, 0.22), transparent 30%),
        radial-gradient(circle at 90% 0%, rgba(139, 125, 255, 0.25), transparent 25%),
        linear-gradient(145deg, #050811, #0a1225 46%, #090d1f);
      --card: rgba(15, 24, 46, 0.82);
      --input-bg: rgba(8, 14, 30, 0.72);
      --output-bg: rgba(8, 14, 30, 0.72);
      --border: rgba(91, 162, 255, 0.32);
      --primary: #45caff;
      --primary-hover: #2eb8ef;
      --secondary-bg: rgba(69, 202, 255, 0.12);
      --secondary-text: #b8dcff;
      --secondary-hover: rgba(69, 202, 255, 0.2);
      --text: #dce9ff;
      --muted: #8ea6d3;
      --success: #3be7a6;
      --error: #ff8f8f;
      --shadow: 0 0 24px rgba(69, 202, 255, 0.18);
      --focus-ring: rgba(69, 202, 255, 0.2);
      --spinner-track: rgba(69, 202, 255, 0.18);
      --overlay-bg: rgba(8, 14, 30, 0.88);
      --chip-bg: rgba(12, 22, 44, 0.9);
      --swap-btn-bg: rgba(12, 22, 44, 0.9);
      --radius-card: 14px;
      --radius-input: 12px;
      --radius-btn: 10px;
      --font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    [data-theme="apple"] {
      --body-bg: linear-gradient(180deg, #f5f5f7 0%, #ffffff 100%);
      --card: rgba(255, 255, 255, 0.82);
      --input-bg: rgba(255, 255, 255, 0.95);
      --output-bg: rgba(245, 245, 247, 0.95);
      --border: rgba(0, 0, 0, 0.08);
      --primary: #0071e3;
      --primary-hover: #0077ed;
      --secondary-bg: #f5f5f7;
      --secondary-text: #1d1d1f;
      --secondary-hover: #ececf0;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --success: #248a3d;
      --error: #d70015;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      --focus-ring: rgba(0, 113, 227, 0.18);
      --spinner-track: rgba(0, 113, 227, 0.18);
      --overlay-bg: rgba(255, 255, 255, 0.82);
      --chip-bg: #f5f5f7;
      --swap-btn-bg: #ffffff;
      --radius-card: 22px;
      --radius-input: 16px;
      --radius-btn: 999px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    [data-theme="cute"] {
      --body-bg: linear-gradient(160deg, #fff0f6 0%, #fff7fb 40%, #f4f0ff 100%);
      --card: #fffafd;
      --input-bg: #fff7fc;
      --output-bg: #fff4fa;
      --border: #f6c9df;
      --primary: #ff6cab;
      --primary-hover: #ff4f98;
      --secondary-bg: #f7e8ff;
      --secondary-text: #8b4bb8;
      --secondary-hover: #efdbff;
      --text: #5b3a4d;
      --muted: #9b6f88;
      --success: #4cb98a;
      --error: #e85d8f;
      --shadow: 0 14px 34px rgba(255, 108, 171, 0.16);
      --focus-ring: rgba(255, 108, 171, 0.18);
      --spinner-track: rgba(255, 108, 171, 0.2);
      --overlay-bg: rgba(255, 247, 252, 0.9);
      --chip-bg: #fff7fc;
      --swap-btn-bg: #fff7fc;
      --radius-card: 24px;
      --radius-input: 18px;
      --radius-btn: 999px;
      --font-family: "Nunito", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--body-bg);
      color: var(--text);
      font-family: var(--font-family);
      padding: 32px 16px;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 15px;
    }

    .theme-switcher {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .theme-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .lang-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .lang-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lang-box label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .lang-select,
    textarea,
    .swap-btn,
    button.primary,
    button.secondary,
    .chip {
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .lang-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-input);
      background: var(--input-bg);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .lang-select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .lang-select:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .swap-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--swap-btn-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }

    .swap-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: rotate(180deg);
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .output-wrap {
      position: relative;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      border-radius: var(--radius-input);
      background: var(--overlay-bg);
      backdrop-filter: blur(2px);
      color: var(--primary);
      font-size: 14px;
      font-weight: 500;
      z-index: 2;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--spinner-track);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
    }

    #output {
      background: var(--output-bg);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button.primary,
    button.secondary {
      border: none;
      border-radius: var(--radius-btn);
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    button.primary:disabled,
    button.secondary:disabled,
    .swap-btn:disabled,
    .theme-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.primary.loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    button.primary.loading .btn-spinner {
      display: inline-block;
    }

    button.secondary {
      background: var(--secondary-bg);
      color: var(--secondary-text);
    }

    button.secondary:hover {
      background: var(--secondary-hover);
    }

    .examples {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    .status.ok {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    .status.loading {
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .panels {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>多语言翻译 Demo</h1>
      <p>支持中文、英语、俄语、法语、日语互译</p>
      <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-btn active" data-theme="simple" type="button">简洁</button>
        <button class="theme-btn" data-theme="tech" type="button">科技</button>
        <button class="theme-btn" data-theme="apple" type="button">Apple</button>
        <button class="theme-btn" data-theme="cute" type="button">可爱</button>
      </div>
    </header>

    <section class="card">
      <div class="lang-bar">
        <div class="lang-box">
          <label for="fromLangSelect">源语言 / From</label>
          <select class="lang-select" id="fromLangSelect"></select>
        </div>
        <button class="swap-btn" id="swapBtn" title="切换语言" type="button">⇄</button>
        <div class="lang-box">
          <label for="toLangSelect">目标语言 / To</label>
          <select class="lang-select" id="toLangSelect"></select>
        </div>
      </div>

      <div class="panels">
        <div class="panel">
          <label for="input">输入文本 / Input</label>
          <textarea id="input" placeholder="请输入要翻译的内容..."></textarea>
        </div>
        <div class="panel output-wrap">
          <label for="output">翻译结果 / Output</label>
          <textarea id="output" readonly placeholder="翻译结果会显示在这里..."></textarea>
          <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <span id="loadingText">正在翻译，请稍候...</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="translateBtn" type="button">
          <span class="btn-spinner"></span>
          <span id="translateBtnText">翻译 Translate</span>
        </button>
        <button class="secondary" id="clearBtn" type="button">清空 Clear</button>
        <button class="secondary" id="copyBtn" type="button">复制结果 Copy</button>
      </div>

      <div class="examples" id="examples"></div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const inputEl = document.getElementById("input");
    const outputEl = document.getElementById("output");
    const statusEl = document.getElementById("status");
    const fromLangSelect = document.getElementById("fromLangSelect");
    const toLangSelect = document.getElementById("toLangSelect");
    const examplesEl = document.getElementById("examples");
    const translateBtn = document.getElementById("translateBtn");
    const translateBtnText = document.getElementById("translateBtnText");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const swapBtn = document.getElementById("swapBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const themeSwitcher = document.getElementById("themeSwitcher");

    const THEME_STORAGE_KEY = "translate-demo-theme";
    const THEMES = ["simple", "tech", "apple", "cute"];

    let isTranslating = false;

    const LANGUAGES = {
      zh: { code: "zh-CN", label: "中文", placeholder: "请输入要翻译的内容..." },
      en: { code: "en", label: "English", placeholder: "Type text to translate..." },
      ru: { code: "ru", label: "Русский", placeholder: "Введите текст для перевода..." },
      fr: { code: "fr", label: "Français", placeholder: "Saisissez le texte à traduire..." },
      ja: { code: "ja", label: "日本語", placeholder: "翻訳するテキストを入力してください..." }
    };

    const examples = {
      zh: ["你好，世界", "今天天气很好", "人工智能正在改变世界"],
      en: ["Hello, world", "How are you today?", "AI is changing the world"],
      ru: ["Привет, мир", "Как дела?", "Искусственный интеллект меняет мир"],
      fr: ["Bonjour le monde", "Comment ça va ?", "L'intelligence artificielle change le monde"],
      ja: ["こんにちは、世界", "お元気ですか", "人工知能が世界を変えています"]
    };

    function getLangKey(selectEl) {
      return selectEl.value;
    }

    function getLangConfig(key) {
      return LANGUAGES[key];
    }

    function setTheme(theme) {
      const nextTheme = THEMES.includes(theme) ? theme : "simple";
      document.documentElement.setAttribute("data-theme", nextTheme);
      themeSwitcher.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.theme === nextTheme);
      });
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      setTheme(savedTheme || "simple");
    }

    function renderLanguageOptions() {
      const options = Object.entries(LANGUAGES)
        .map(([key, lang]) => `<option value="${key}">${lang.label}</option>`)
        .join("");

      fromLangSelect.innerHTML = options;
      toLangSelect.innerHTML = options;
      fromLangSelect.value = "zh";
      toLangSelect.value = "en";
    }

    function updateLangUI() {
      const fromLang = getLangConfig(getLangKey(fromLangSelect));
      inputEl.placeholder = fromLang.placeholder;
      outputEl.placeholder = "翻译结果会显示在这里... / Translation will appear here...";
      renderExamples();
    }

    function renderExamples() {
      const fromKey = getLangKey(fromLangSelect);
      examplesEl.innerHTML = (examples[fromKey] || [])
        .map((text) => `<button class="chip" data-text="${text}" type="button">${text}</button>`)
        .join("");
    }

    function ensureDifferentLanguages() {
      if (fromLangSelect.value === toLangSelect.value) {
        const keys = Object.keys(LANGUAGES);
        const currentIndex = keys.indexOf(fromLangSelect.value);
        toLangSelect.value = keys[(currentIndex + 1) % keys.length];
      }
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function setLoading(loading) {
      isTranslating = loading;
      translateBtn.disabled = loading;
      swapBtn.disabled = loading;
      clearBtn.disabled = loading;
      copyBtn.disabled = loading;
      inputEl.disabled = loading;
      fromLangSelect.disabled = loading;
      toLangSelect.disabled = loading;
      themeSwitcher.querySelectorAll(".theme-btn").forEach((btn) => {
        btn.disabled = loading;
      });
      translateBtn.classList.toggle("loading", loading);
      loadingOverlay.classList.toggle("active", loading);

      examplesEl.querySelectorAll(".chip").forEach((chip) => {
        chip.disabled = loading;
      });

      if (loading) {
        translateBtnText.textContent = "翻译中...";
        loadingText.textContent = "正在翻译，请稍候...";
        setStatus("正在请求翻译服务...", "loading");
      } else {
        translateBtnText.textContent = "翻译 Translate";
        loadingText.textContent = "正在翻译，请稍候...";
      }
    }

    async function translateText(text) {
      const fromLang = getLangConfig(getLangKey(fromLangSelect));
      const toLang = getLangConfig(getLangKey(toLangSelect));
      const langpair = `${fromLang.code}|${toLang.code}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("翻译服务暂时不可用，请稍后再试。");
      }
      const data = await response.json();
      const translated = data?.responseData?.translatedText;
      if (!translated) {
        throw new Error("未获取到翻译结果。");
      }
      return translated;
    }

    async function handleTranslate() {
      if (isTranslating) return;

      const text = inputEl.value.trim();
      if (!text) {
        setStatus("请先输入要翻译的内容。", "error");
        return;
      }

      if (fromLangSelect.value === toLangSelect.value) {
        setStatus("源语言和目标语言不能相同。", "error");
        return;
      }

      setLoading(true);
      outputEl.value = "";

      try {
        const result = await translateText(text);
        outputEl.value = result;
        setStatus("翻译完成。", "ok");
      } catch (error) {
        setStatus(error.message || "翻译失败，请检查网络后重试。", "error");
      } finally {
        setLoading(false);
      }
    }

    themeSwitcher.addEventListener("click", (event) => {
      const btn = event.target.closest(".theme-btn");
      if (!btn || isTranslating) return;
      setTheme(btn.dataset.theme);
    });

    translateBtn.addEventListener("click", handleTranslate);
    clearBtn.addEventListener("click", () => {
      if (isTranslating) return;
      inputEl.value = "";
      outputEl.value = "";
      setStatus("");
    });
    copyBtn.addEventListener("click", async () => {
      if (isTranslating) return;
      if (!outputEl.value) {
        setStatus("没有可复制的内容。", "error");
        return;
      }
      await navigator.clipboard.writeText(outputEl.value);
      setStatus("已复制到剪贴板。", "ok");
    });
    swapBtn.addEventListener("click", () => {
      if (isTranslating) return;
      const tempLang = fromLangSelect.value;
      fromLangSelect.value = toLangSelect.value;
      toLangSelect.value = tempLang;
      const tempText = inputEl.value;
      inputEl.value = outputEl.value;
      outputEl.value = tempText;
      updateLangUI();
      setStatus("已切换翻译方向。");
    });
    fromLangSelect.addEventListener("change", () => {
      ensureDifferentLanguages();
      updateLangUI();
    });
    toLangSelect.addEventListener("change", () => {
      if (fromLangSelect.value === toLangSelect.value) {
        setStatus("源语言和目标语言不能相同。", "error");
      } else {
        setStatus("");
      }
    });
    examplesEl.addEventListener("click", (event) => {
      if (isTranslating) return;
      const chip = event.target.closest(".chip");
      if (!chip) return;
      inputEl.value = chip.dataset.text;
      handleTranslate();
    });
    inputEl.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        handleTranslate();
      }
    });

    initTheme();
    renderLanguageOptions();
    updateLangUI();
  </script>
</body>
</html>
